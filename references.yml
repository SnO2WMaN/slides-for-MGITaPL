KK25:
  type: web
  title: Modal Logical Aspects of Provability Predicates and Consistency Statements
  author:
    - Kogure, Haruka
    - Kurahashi, Taishi
  date: 2025-11-19
  url:
    value: http://arxiv.org/abs/2511.15531
    date: 2025-12-07
  serial-number:
    arxiv: "2511.15531"
    doi: 10.48550/arXiv.2511.15531
  abstract: This paper studies the modal logical aspects of provability predicates and consistency statements for theories of arithmetic. First, we provide an overview of previous works on the correspondence between various derivability conditions for provability predicates and different modal logics. The main technical contribution of the present paper is to establish the arithmetical completeness of the logics NP, ND, NP4, and ND4 by extending Solovay’s method and refining Arai’s construction of Rosser provability predicates.

Kur24:
  type: article
  title: The Provability Logic of All Provability Predicates
  author: Kurahashi, Taishi
  date: 2024-09
  page-range: 1108-1135
  serial-number:
    doi: 10.1093/logcom/exad060
    issn: 0955-792X, 1465-363X
  abstract: Abstract We prove that the provability logic of all provability predicates is exactly Fitting, Marek, and Truszczyński’s pure logic of necessitation \$\\textsf\{N\}\$. Moreover, we introduce three extensions \$\\textsf\{N4\}\$, \$\\textsf\{NR\}\$ and \$\\textsf\{NR4\}\$ of \$\\textsf\{N\}\$ and investigate the arithmetical semantics of these logics. In fact, we prove that \$\\textsf\{N4\}\$, \$\\textsf\{NR\}\$ and \$\\textsf\{NR4\}\$ are the provability logics of all provability predicates satisfying the third condition \$\\textbf\{D3\}\$ of the derivability conditions, all Rosser provability predicates and all Rosser provability predicates satisfying \$\\textbf\{D3\}\$, respectively.
  parent:
    type: periodical
    title: Journal of Logic and Computation
    issue: 6
    volume: 34

