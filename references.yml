MT48:
  type: article
  title: Some Theorems about the Sentential Calculi of {Lewis} and {Heyting}
  author:
    - McKinsey, J. C. C.
    - Tarski, Alfred
  date: 1948-03
  page-range: 1-15
  url:
    value: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/article/abs/some-theorems-about-the-sentential-calculi-of-lewis-and-heyting/A1AA3FA63649C074202F605A4D2094A4
    date: 2024-09-19
  serial-number:
    doi: 10.2307/2268135
    issn: 0022-4812, 1943-5886
  abstract: In this paper we shall prove theorems about some systems of sentential calculus, by making use of results we have established elsewhere regarding closure algebras and Brouwerian albegras. We shall be concerned mostly with the Lewis system and the Heyting system. Some of the results here are new (in particular, Theorems 2.4, 3.1, 3.9, 3.10, 4.5, and 4.6); others have been stated without proof in the literature (in particular, Theorems 2.1, 2.2, 4.4, 5.2, and 5.3).The proofs to be given here will be found to be mostly very simple; generally speaking, they amount to drawing conclusions from the theorems established in McKinsey and Tarski [10] and [11]. We have thought it might be worth while, however, to publish these rather elementary consequences of our previous work—so as to make them readily available to those whose main interest lies in sentential calculus rather than in topology or algebra.
  parent:
    type: periodical
    title: The Journal of Symbolic Logic
    issue: 1
    volume: 13

SMdJ16:
  type: article
  title: Weak Subintuitionistic Logics
  author:
    - name: Shirmohammadzadeh Maleki
      given-name: Fatemeh
    - name: de Jongh
      given-name: Dick
  date: 2016-12-26
  page-range: jzw62
  url:
    value: https://academic.oup.com/jigpal/article-lookup/doi/10.1093/jigpal/jzw062
    date: 2025-11-12
  serial-number:
    doi: 10.1093/jigpal/jzw062
    issn: 1367-0751, 1368-9894
  abstract: A system WF of subintuitionistic logic is introduced, weaker than Corsi’s basic subintuitionistic system F. A derivation system with and without hypotheses is given in line with the authors’ derivation system for F. A neighbourhood semantics is introduced with a somewhat more complex definition than the neighbourhood semantics for non-normal modal logics. Completeness is proved for WF with respect to this neighbourhood semantics, and similarly for some logics between WF and F which characterize nice frame classes. The study by the authors of the conservativity of IPC over F with respect to some classes of implications is extended to WF, and shows clearly the difference in strength between the two logics. Study of translations of these weak subintuitionistic logics into non-normal modal logics turned out to be hard because of the difference between their respective neighbourhood structures and leaves us with some open problems.
  parent:
    type: periodical
    title: Logic Journal of IGPL

dJSM17:
  type: article
  title: Subintuitionistic {Logics} with {Kripke Semantics}
  author:
    - name: de Jongh
      given-name: Dick
    - name: Shirmohammadzadeh Maleki
      given-name: Fatemeh
  date: 2017
  editor:
    - Hansen, Helle Hvid
    - Murray, Sarah E.
    - Sadrzadeh, Mehrnoosh
    - Zeevat, Henk
  page-range: 333-354
  url:
    value: http://link.springer.com/10.1007/978-3-662-54332-0_18
    date: 2025-10-13
  serial-number:
    doi: 10.1007/978-3-662-54332-0_18
    isbn: 978-3-662-54331-3 978-3-662-54332-0
  abstract: The subintuitionistic logics introduced by Corsi and Restall are developed in a uniform manner. Proof systems are given for derivations without and with assumptions. The results are applied to give conservation theorems for intuitionistic logic IPC over Corsi’s system F. For Visser’s basic logic strong completeness is proved and additional conservation results are obtained.
  parent:
    type: anthology
    title: Logic, {Language}, and {Computation}
    publisher:
      name: Springer Berlin Heidelberg
      location: Berlin, Heidelberg
    volume: 10148

dJSM18:
  type: article
  title: Subintuitionistic Logics and the Implications They Prove
  author:
    - name: de Jongh
      given-name: Dick
    - name: Shirmohammadzadeh Maleki
      given-name: Fatemeh
  date: 2018-12
  page-range: 1525-1545
  url:
    value: https://linkinghub.elsevier.com/retrieve/pii/S0019357718303240
    date: 2025-11-18
  serial-number:
    doi: 10.1016/j.indag.2018.01.013
    issn: "00193577"
  abstract: This is an investigation of the implications of IPC which remain provable when one weakens intuitionistic logic in various ways. The research is concerned with logics with Kripke models as introduced by G. Corsi in 1987, and others like G. Restall, Došen, Visser. This leads to conservativity results for IPC with regard to classes of implications in some of these logics. Moreover, similar results are reached for some weaker subintuitionistic systems with neighborhood models introduced by the authors in 2016. In addition, the relationship between two types of neighborhood models introduced in that work is clarified. This clarification leads also to modal companions for weaker logics.
  parent:
    type: periodical
    title: Indagationes Mathematicae
    issue: 6
    volume: 29

